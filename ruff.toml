"booktree.py" = ["F401", "F841"]
"myx_*.py" = ["F401", "F841"]
# S301: pickle load of cookies.pkl — removed together with the secrets/cookie-store work (roadmap item 5)
"myx_mam.py" = ["F401", "F841", "S301"]
