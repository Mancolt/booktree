version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # 3.23 ships ffmpeg 8 (ffprobe reads the tags and durations); move deliberately, then drop this
    ignore:
      - dependency-name: alpine
        versions: [">=3.23"]
