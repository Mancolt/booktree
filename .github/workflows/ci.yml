name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pip-audit
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Static security scan (bandit)
        # high severity gates the build now; the two inherited medium findings (pickle load of cookies.pkl in
        # myx_mam.py) are removed with the secrets/cookie-store work, after which this tightens to -ll
        run: bandit -q -r . -x ./tests -lll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mancolt/booktree
          # main -> :edge (untested, for the maintainer); version tags v1.2.3 -> :1.2.3, :1.2 and :latest
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # pull requests build both platforms into the cache only (multi-arch images cannot be loaded locally)
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          sbom: true
          build-args: |
            UID=1000
            GID=1000
            USER=booktree
            GROUPNAME=booktree
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # the package may be private until visibility is flipped; pull with the workflow token
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/mancolt/booktree:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
